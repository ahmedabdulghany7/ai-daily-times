:root{
  --bg:#060A0C; --teal:#0FA3A3; --orange:#FF8A00; --text:#ffffff; --muted:#96A4AA;
  --gutter:clamp(18px,4vw,48px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:"Poppins",system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
body{
  background:
    radial-gradient(60vmax 60vmax at 0% 0%, rgba(15,163,163,.20), transparent 60%),
    radial-gradient(60vmax 60vmax at 100% 100%, rgba(255,138,0,.16), transparent 60%),
    var(--bg);
}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ui{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:max(var(--gutter),env(safe-area-inset-top)) var(--gutter) max(var(--gutter),env(safe-area-inset-bottom))}
nav{display:flex;align-items:center;justify-content:space-between;gap:16px;pointer-events:auto;opacity:0;transform:translateY(-8px);transition:opacity 1s ease,transform 1s ease}
nav .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase}
nav .dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--teal),var(--orange));box-shadow:0 0 14px rgba(15,163,163,.8)}
nav ul{display:flex;gap:28px;list-style:none;font-size:14px;color:var(--muted)}
nav a{color:inherit;text-decoration:none;transition:color .2s}
nav a:hover{color:#fff}
.pill{pointer-events:auto;font-size:13px;font-weight:700;color:#fff;text-decoration:none;padding:9px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.05);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:border-color .2s,background .2s}
.pill:hover{border-color:var(--teal);background:rgba(15,163,163,.16)}
.copy{position:absolute;left:0;right:0;text-align:center;padding:0 var(--gutter);opacity:0;transform:translateY(14px);transition:opacity 1.2s ease,transform 1.2s ease;pointer-events:none}
.copy p{font-size:clamp(14px,1.6vw,19px);color:var(--muted);max-width:560px;margin:0 auto;line-height:1.55}
.btns{display:flex;gap:12px;justify-content:center;margin-top:24px;flex-wrap:wrap}
.btn{pointer-events:auto;font-weight:700;font-size:14px;text-decoration:none;padding:13px 26px;border-radius:999px;transition:transform .2s,box-shadow .2s}
.btn.primary{color:#06100f;background:linear-gradient(135deg,var(--teal),var(--orange));box-shadow:0 8px 30px rgba(15,163,163,.28)}
.btn.primary:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(255,138,0,.34)}
.btn.ghost{color:#fff;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.04)}
.btn.ghost:hover{border-color:#fff;transform:translateY(-2px)}
footer{display:flex;justify-content:space-between;align-items:flex-end;font-size:12px;color:var(--muted);letter-spacing:.06em}
footer .hint{opacity:0;transition:opacity 1s ease .6s}
.show nav,.show .copy{opacity:1;transform:none}
.show footer .hint{opacity:.8}
.hide-hint footer .hint{opacity:0!important}
.noui nav,.noui .copy{display:none}
@media (max-width:700px){nav ul{display:none}}
@media (prefers-reduced-motion:reduce){nav,.copy{transition:none}}
</style>
</head>

document.documentElement.style.setProperty("--teal", CONFIG.colorA);
document.documentElement.style.setProperty("--orange", CONFIG.colorB);
$("navLogo").textContent = CONFIG.navLogo;
$("tagline").textContent = CONFIG.tagline;
$("handle").textContent = CONFIG.handle;
$("hint").textContent = matchMedia("(pointer:coarse)").matches ? "Tap to blast." : CONFIG.hint;
const setLink=(el,[t,h])=>{el.textContent=t;el.href=h};
setLink($("navCta"),CONFIG.navCta); setLink($("btn1"),CONFIG.button1); setLink($("btn2"),CONFIG.button2);
CONFIG.navLinks.forEach(l=>{const li=document.createElement("li");const a=document.createElement("a");setLink(a,l);li.appendChild(a);$("navLinks").appendChild(li)});
if(params.get("ui")==="0") document.body.classList.add("noui");

const hex=h=>{h=h.replace("#","");if(h.length===3)h=h.split("").map(c=>c+c).join("");const n=parseInt(h,16);return[(n>>16&255)/255,(n>>8&255)/255,(n&255)/255]};
const colA=hex(CONFIG.colorA), colB=hex(CONFIG.colorB);

/* ---------- WebGL setup ---------- */
const canvas=$("c");
const gl=canvas.getContext("webgl",{alpha:true,premultipliedAlpha:true,antialias:false,preserveDrawingBuffer:true});
if(!gl){document.body.insertAdjacentHTML("beforeend",'<p style="position:fixed;inset:0;display:grid;place-items:center;color:#96A4AA">WebGL is not available in this browser.</p>');return}

const VS=`
attribute vec3 aPos; attribute vec4 aMeta; attribute vec3 aCol;
uniform vec2 uRes; uniform mat3 uRot; uniform float uF; uniform float uDpr; uniform float uTime; uniform float uSize; uniform float uSweep; uniform float uShim;
varying vec3 vCol; varying float vA;
void main(){
  vec3 p = uRot * aPos;
  float s = uF / (uF - p.z);
  vec2 ndc = vec2(p.x*s*2.0/uRes.x, -p.y*s*2.0/uRes.y);
  float tw = 0.78 + 0.22*sin(uTime*2.4 + aMeta.x*40.0);
  float sweep = exp(-pow((aMeta.y - uSweep)*7.0, 2.0)) * uShim;
  float hot = step(1.1, aMeta.w);
  float depthFade = clamp(0.55 + s*0.45, 0.4, 1.4);
  vA = (0.85*tw + sweep*1.2) * depthFade;
  vCol = mix(aCol, vec3(1.0), clamp(sweep*0.7 + hot*0.55, 0.0, 1.0));
  gl_Position = vec4(ndc, 0.0, 1.0);
  gl_PointSize = max(1.5, uSize * aMeta.z * s * uDpr * (1.0 + sweep*0.7 + hot*0.4));
}`;
const FS=`
precision mediump float;
varying vec3 vCol; varying float vA; uniform float uGlow;
void main(){
  vec2 q = gl_PointCoord - 0.5; float d = length(q)*2.0;
  if(d>1.0) discard;
  float core = smoothstep(0.45,0.0,d);
  float halo = pow(1.0-d, 2.4);
  float a = (core*0.85 + halo*0.75*uGlow) * vA;
  gl_FragColor = vec4(vCol*a, a);
}`;
const FADE_VS="attribute vec2 p;void main(){gl_Position=vec4(p,0.0,1.0);}";
const FADE_FS="precision mediump float;uniform float uK;void main(){gl_FragColor=vec4(0.0,0.0,0.0,uK);}";

function prog(vs,fs){
  const mk=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(o));return o};
  const p=gl.createProgram();gl.attachShader(p,mk(gl.VERTEX_SHADER,vs));gl.attachShader(p,mk(gl.FRAGMENT_SHADER,fs));gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS))console.error(gl.getProgramInfoLog(p));return p;
}
const P=prog(VS,FS), PF=prog(FADE_VS,FADE_FS);
const loc={aPos:gl.getAttribLocation(P,"aPos"),aMeta:gl.getAttribLocation(P,"aMeta"),aCol:gl.getAttribLocation(P,"aCol")};
const U=n=>gl.getUniformLocation(P,n);
const uni={res:U("uRes"),rot:U("uRot"),f:U("uF"),dpr:U("uDpr"),time:U("uTime"),size:U("uSize"),sweep:U("uSweep"),shim:U("uShim"),glow:U("uGlow")};
const fadeK=gl.getUniformLocation(PF,"uK"), fadeP=gl.getAttribLocation(PF,"p");
const quad=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,quad);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const posBuf=gl.createBuffer(), metaBuf=gl.createBuffer(), colBuf=gl.createBuffer();

/* ---------- state ---------- */
let W=0,H=0,DPR=1,N=0;
let T,S,ox,oy,oz,vx,vy,vz,delay,spin,pos,meta,col;   // typed arrays
let textBox={top:0,bottom:0};
const mouse={x:-9999,y:-9999,active:false,lastMove:0};
let rotY=0,rotX=0,tRotY=0,tRotX=0;
const F=1100;

function wrapBrand(text,maxChars){
  if(text.length<=maxChars||!text.includes(" "))return[text];
  const words=text.split(" ");let best=null;
  for(let i=1;i<words.length;i++){
    const a=words.slice(0,i).join(" "),b=words.slice(i).join(" ");
    const score=Math.abs(a.length-b.length);
    if(!best||score<best.score)best={score,lines:[a,b]};
  }
  return best.lines;
}

function buildTargets(){
  const narrow=W<700;
  const lines=narrow?wrapBrand(CONFIG.brand,10):[CONFIG.brand];
  const off=document.createElement("canvas");const ctx=off.getContext("2d",{willReadFrequently:true});
  // pick font size so the widest line fits
  const maxW=Math.min(W*(narrow?0.88:0.82),1180);
  let fs=200;ctx.font=`700 ${fs}px Poppins`;
  const widest=Math.max(...lines.map(l=>ctx.measureText(l).width));
  fs=Math.floor(fs*maxW/widest);
  const lh=fs*1.08;
  const bw=Math.ceil(maxW+40), bh=Math.ceil(lh*lines.length+40);
  off.width=bw;off.height=bh;
  ctx.font=`700 ${fs}px Poppins`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle="#fff";
  lines.forEach((l,i)=>ctx.fillText(l,bw/2,20+lh*(i+0.5)));
  const img=ctx.getImageData(0,0,bw,bh).data;
  const cand=[];
  for(let y=0;y<bh;y++)for(let x=0;x<bw;x++){if(img[(y*bw+x)*4+3]>140)cand.push(x,y)}
  const total=cand.length/2;
  // vertical placement: leave room for tagline + buttons below
  const hasUI=!document.body.classList.contains("noui");
  const centerY=(hasUI?H*0.40:H*0.5);
  const cx=bw/2, cy=bh/2;
  T=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    const k=(Math.random()*total|0)*2;
    T[i*3]  =(cand[k]-cx)+(Math.random()-.5)*1.2;
    T[i*3+1]=(cand[k+1]-cy)+(centerY-H/2)+(Math.random()-.5)*1.2;
    T[i*3+2]=(Math.random()-.5)*26;
  }
  textBox.top=centerY-lh*lines.length/2;textBox.bottom=centerY+lh*lines.length/2;
  return {halfW:maxW/2};
}

function buildParticles(){
  const mobile=W<700||matchMedia("(pointer:coarse)").matches;
  N=Math.round(CONFIG.particles*(mobile?0.6:1));
  const info=buildTargets();
  S=new Float32Array(N*3);ox=new Float32Array(N);oy=new Float32Array(N);oz=new Float32Array(N);
  vx=new Float32Array(N);vy=new Float32Array(N);vz=new Float32Array(N);
  delay=new Float32Array(N);spin=new Float32Array(N);
  pos=new Float32Array(N*3);meta=new Float32Array(N*4);col=new Float32Array(N*3);
  const R=Math.max(W,H);
  for(let i=0;i<N;i++){
    const a=Math.random()*Math.PI*2, r=R*(0.62+Math.random()*0.45);
    S[i*3]=Math.cos(a)*r*(W>H?1.15:0.9); S[i*3+1]=Math.sin(a)*r*(H>W?1.15:0.9); S[i*3+2]=-500+Math.random()*900;
    // delay: left side arrives a touch earlier so it reads like a wave
    const nx=(T[i*3]/info.halfW)*.5+.5;
    delay[i]=clamp(nx*0.9+Math.random()*0.55,0,1.45);
    spin[i]=(Math.random()<.5?-1:1)*(0.35+Math.random()*0.65);
    const t=clamp(nx+(Math.random()-.5)*0.25,0,1);
    const hot=Math.random()<0.05;
    col[i*3]=colA[0]+(colB[0]-colA[0])*t;col[i*3+1]=colA[1]+(colB[1]-colA[1])*t;col[i*3+2]=colA[2]+(colB[2]-colA[2])*t;
    const size=hot?2.2+Math.random()*1.2:1.0+Math.random()*1.2;
    meta[i*4]=Math.random();meta[i*4+1]=nx;meta[i*4+2]=size;meta[i*4+3]=hot?1.25:0.9;
  }
  gl.bindBuffer(gl.ARRAY_BUFFER,metaBuf);gl.bufferData(gl.ARRAY_BUFFER,meta,gl.STATIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER,colBuf);gl.bufferData(gl.ARRAY_BUFFER,col,gl.STATIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER,posBuf);gl.bufferData(gl.ARRAY_BUFFER,pos,gl.DYNAMIC_DRAW);
}

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);
  buildParticles();
  // place tagline under the text
  const copy=$("copy");copy.style.top=Math.round(textBox.bottom+Math.min(H*0.05,44))+"px";
}

/* ---------- timeline ---------- */
const GATHER=4.2, HOLD_END_OFFSET=2.6; // seconds
function progressAt(t,delayI){
  const L=CONFIG.loopSeconds;
  const tt=L>0?(t%L):t;
  // gather
  const g=clamp((tt-delayI*1.1)/2.7,0,1);
  let p=easeInOut(g);
  // scatter at the end of the loop
  if(L>0){
    const sStart=L-HOLD_END_OFFSET+delayI*0.45;
    const s=clamp((tt-sStart)/1.5,0,1);
    p*=1-easeIn(s);
  }
  return p;
}
function sweepAt(t){
  const L=CONFIG.loopSeconds;const tt=L>0?(t%L):t;
  const start=GATHER+0.1, dur=1.8;
  if(tt<start||tt>start+dur)return {x:-5,k:0};
  const u=(tt-start)/dur;return {x:u*1.5-0.25,k:Math.sin(u*Math.PI)};
}

/* ---------- input ---------- */
function setMouse(x,y){mouse.x=x;mouse.y=y;mouse.active=true;mouse.lastMove=performance.now();tRotY=((x/W)-.5)*0.22*CONFIG.cameraDrift;tRotX=((y/H)-.5)*0.12*CONFIG.cameraDrift;document.body.classList.add("hide-hint")}
addEventListener("pointermove",e=>setMouse(e.clientX,e.clientY),{passive:true});
addEventListener("pointerleave",()=>{mouse.active=false;mouse.x=mouse.y=-9999});
addEventListener("pointerup",e=>{if(e.pointerType==="touch"){mouse.active=false;mouse.x=mouse.y=-9999}});
function blast(x,y){
  for(let i=0;i<N;i++){
    const px=pos[i*3]+W/2,py=pos[i*3+1]+H/2;
    const dx=px-x,dy=py-y;const d=Math.hypot(dx,dy)+1;
    const f=clamp(520/d,0.2,5)*(0.6+Math.random()*0.8);
    vx[i]+=dx/d*f*9;vy[i]+=dy/d*f*9;vz[i]+=(Math.random()-.5)*60*f;
  }
}
canvas.addEventListener("pointerdown",e=>blast(e.clientX,e.clientY));
addEventListener("resize",()=>{clearTimeout(resize._t);resize._t=setTimeout(resize,150)});

/* ---------- main loop ---------- */
let t0=performance.now(), last=t0, shown=false;
const rot=new Float32Array(9);
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  const t=reduceMotion?999:(now-t0)/1000;
  const sw=sweepAt(t);

  // smooth camera
  const auto=CONFIG.cameraDrift*(0.07*Math.sin(t*0.35)), autoX=CONFIG.cameraDrift*(0.035*Math.sin(t*0.27+1));
  rotY+=((tRotY+auto)-rotY)*Math.min(1,dt*2.2);rotX+=((tRotX+autoX)-rotX)*Math.min(1,dt*2.2);
  const cy=Math.cos(rotY),sy=Math.sin(rotY),cx=Math.cos(rotX),sx=Math.sin(rotX);
  // R = Rx * Ry (column-major)
  rot[0]=cy;rot[1]=sx*sy;rot[2]=-cx*sy;
  rot[3]=0;rot[4]=cx;rot[5]=sx;
  rot[6]=sy;rot[7]=-sx*cy;rot[8]=cx*cy;

  const mr=CONFIG.mouseRadius, mr2=mr*mr;
  const mx=mouse.x-W/2,my=mouse.y-H/2;
  const k=Math.min(1,dt*60);
  for(let i=0;i<N;i++){
    const p=progressAt(t,delay[i]);
    const q=1-p;
    // curved flight path: a swirl that vanishes when the particle arrives
    const curl=Math.sin(Math.PI*p)*spin[i]*260;
    const tx=T[i*3],ty=T[i*3+1],tz=T[i*3+2];
    const sx0=S[i*3],sy0=S[i*3+1],sz0=S[i*3+2];
    let x=sx0*q+tx*p, y=sy0*q+ty*p, z=sz0*q+tz*p;
    // perpendicular of the travel direction
    const dx=tx-sx0, dy=ty-sy0, dl=Math.hypot(dx,dy)+1;
    x+=-dy/dl*curl;y+=dx/dl*curl;

    // mouse repel with spring return (only meaningful once arrived)
    if(mouse.active&&p>0.02){
      const ex=x+ox[i]-mx,ey=y+oy[i]-my;const d2=ex*ex+ey*ey;
      if(d2<mr2){const d=Math.sqrt(d2)+0.001;const f=(1-d/mr);const push=f*f*(26+f*40);vx[i]+=ex/d*push*k;vy[i]+=ey/d*push*k;vz[i]+=(Math.random()-.3)*18*f*k}
    }
    // spring toward zero offset
    vx[i]+=-ox[i]*0.018*k;vy[i]+=-oy[i]*0.018*k;vz[i]+=-oz[i]*0.018*k;
    vx[i]*=Math.pow(0.90,k);vy[i]*=Math.pow(0.90,k);vz[i]*=Math.pow(0.90,k);
    ox[i]+=vx[i]*k*0.5;oy[i]+=vy[i]*k*0.5;oz[i]+=vz[i]*k*0.5;

    // gentle breathing once assembled
    const br=p>0.98?Math.sin(t*1.3+meta[i*4]*30)*1.4:0;
    pos[i*3]=x+ox[i]+br;pos[i*3+1]=y+oy[i]+br*0.7;pos[i*3+2]=z+oz[i];
  }

  // reveal UI after the first gather
  if(!shown&&t>GATHER-0.4){shown=true;document.body.classList.add("show")}

  // draw: fade previous frame for trails, then additive particles
  gl.enable(gl.BLEND);
  gl.blendFuncSeparate(gl.ZERO,gl.ONE_MINUS_SRC_ALPHA,gl.ZERO,gl.ONE_MINUS_SRC_ALPHA);
  gl.useProgram(PF);gl.bindBuffer(gl.ARRAY_BUFFER,quad);gl.enableVertexAttribArray(fadeP);gl.vertexAttribPointer(fadeP,2,gl.FLOAT,false,0,0);
  gl.uniform1f(fadeK,clamp(1-CONFIG.trails*0.82,0.06,1));
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  gl.disableVertexAttribArray(fadeP);

  gl.blendFuncSeparate(gl.ONE,gl.ONE,gl.ONE,gl.ONE);
  gl.useProgram(P);
  gl.bindBuffer(gl.ARRAY_BUFFER,posBuf);gl.bufferSubData(gl.ARRAY_BUFFER,0,pos);
  gl.enableVertexAttribArray(loc.aPos);gl.vertexAttribPointer(loc.aPos,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,metaBuf);gl.enableVertexAttribArray(loc.aMeta);gl.vertexAttribPointer(loc.aMeta,4,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER,colBuf);gl.enableVertexAttribArray(loc.aCol);gl.vertexAttribPointer(loc.aCol,3,gl.FLOAT,false,0,0);
  gl.uniform2f(uni.res,W,H);gl.uniformMatrix3fv(uni.rot,false,rot);gl.uniform1f(uni.f,F);
  gl.uniform1f(uni.dpr,DPR);gl.uniform1f(uni.time,t);gl.uniform1f(uni.size,CONFIG.particleSize*2.1);
  gl.uniform1f(uni.sweep,sw.x);gl.uniform1f(uni.shim,sw.k);gl.uniform1f(uni.glow,CONFIG.glow);
  gl.drawArrays(gl.POINTS,0,N);
  requestAnimationFrame(frame);
}

/* ---------- start (wait for the font so the text is sampled correctly) ---------- */
Promise.all([document.fonts.load("700 100px Poppins"),document.fonts.load("400 16px Poppins")]).catch(()=>{}).then(()=>{
  resize();
  if(reduceMotion)document.body.classList.add("show");
  t0=performance.now();last=t0;requestAnimationFrame(frame);
  // expose a tiny hook so a recorder/test can restart the intro
  window.restartHero=()=>{t0=performance.now();shown=false;document.body.classList.remove("show")};
  window.__heroTime=()=>(performance.now()-t0)/1000;
  window.__setHeroTime=s=>{t0=performance.now()-s*1000};
});
})();
</script>
</body>
</html>
